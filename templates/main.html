<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confero</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f2ebe3;
            color: #1e1e1e;
            font-family: 'Inter', system-ui, sans-serif;
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
            border-bottom: 3px dashed #d9c5b2;
            padding-bottom: 12px;
        }

        .logo {
            font-family: 'DM Serif Display', serif;
            font-size: 36px;
            color: #1e1e1e;
        }

        .logo span {
            color: #a67b5e;
            font-style: italic;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            display: inline-block;
            background: #1e1e1e;
            color: #fcf8f5;
            border: 2px solid #1e1e1e;
            padding: 10px 20px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            transition: 0.12s;
        }

        .btn:hover {
            background: #fcf8f5;
            color: #1e1e1e;
        }

        .btn-outline {
            background: transparent;
            color: #1e1e1e;
        }

        .add-wrap {
            margin-bottom: 24px;
        }

        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .room-card {
            background: #fcf8f5;
            padding: 20px;
            border: 2px solid #1e1e1e;
            border-radius: 8px 28px 8px 28px;
            box-shadow: 6px 6px 0 #1e1e1e;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: 0.15s ease;
        }

        .room-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0 #1e1e1e;
        }

        .room-card.busy {
            opacity: 0.65;
            background: #ece3db;
        }

        .room-card .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .room-card .name {
            font-family: 'DM Serif Display', serif;
            font-size: 23px;
        }

        .room-card .capacity {
            background: #ece3db;
            padding: 3px 9px;
            border: 1px solid #1e1e1e;
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
        }

        .room-card .equipment,
        .room-card .organization {
            font-size: 14px;
            line-height: 1.4;
        }

        .room-card .status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .room-card .status.free {
            color: #2b6e3b;
        }

        .room-card .status.busy {
            color: #a63a3a;
        }

        .room-card .footer {
            display: flex;
            justify-content: flex-end;
            border-top: 2px dotted #d9c5b2;
            padding-top: 12px;
            margin-top: auto;
        }

        .btn-book {
            background: #1e1e1e;
            color: #fcf8f5;
            border: 2px solid #1e1e1e;
            padding: 7px 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-book:hover:not(:disabled) {
            background: #fcf8f5;
            color: #1e1e1e;
        }

        .btn-book:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(30, 30, 30, 0.3);
            backdrop-filter: blur(2px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #fcf8f5;
            padding: 32px;
            border: 2px solid #1e1e1e;
            border-radius: 8px 36px 8px 36px;
            box-shadow: 10px 10px 0 #1e1e1e;
            max-width: 480px;
            width: 90%;
        }

        .modal h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 20px;
            border-bottom: 3px dashed #d9c5b2;
            padding-bottom: 8px;
        }

        .modal label {
            display: block;
            margin: 12px 0 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
        }

        .modal input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #1e1e1e;
            background: #ffffff;
            font-size: 15px;
            outline: none;
        }

        .modal input:focus {
            border-color: #a67b5e;
        }

        .modal .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-secondary {
            background: transparent;
            color: #1e1e1e;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1e1e;
            color: #fcf8f5;
            padding: 14px 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            header {
                flex-direction: column;
                align-items: stretch;
            }

            .header-actions {
                justify-content: space-between;
            }

            .modal {
                padding: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <div class="logo">
            Con<span>fero</span>
        </div>

        <div class="header-actions">

            <a href="/login" class="btn btn-outline">
                Выйти
            </a>
        </div>
    </header>

    <div class="add-wrap">
        <button class="btn" id="addRoomBtn">
            Добавить комнату
        </button>
    </div>

    <div class="room-grid" id="roomGrid"></div>

</div>

<div class="modal-overlay" id="addRoomModal">
    <div class="modal">
        <h2>Новая комната</h2>

        <label for="newRoomName">Название</label>
        <input type="text" id="newRoomName" placeholder="Переговорная А">

        <label for="newRoomCapacity">Вместимость</label>
        <input type="number" id="newRoomCapacity" placeholder="10" min="1">

        <label for="newRoomEquip">Оснащение</label>
        <input type="text" id="newRoomEquip" placeholder="Проектор, доска">

        <div class="actions">
            <button class="btn btn-secondary" id="cancelAddRoom">Отмена</button>
            <button class="btn" id="saveAddRoom">Сохранить</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="bookModal">
    <div class="modal">
        <h2>Бронирование</h2>
        <p id="bookRoomName"></p>

        <label for="bookDate">Дата</label>
        <input type="date" id="bookDate">

        <label for="bookStart">Начало</label>
        <input type="time" id="bookStart">

        <label for="bookEnd">Конец</label>
        <input type="time" id="bookEnd">

        <div class="actions">
            <button class="btn btn-secondary" id="cancelBook">Отмена</button>
            <button class="btn" id="saveBook">Забронировать</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    let rooms = [];

    function getToday() {
        return new Date().toISOString().split('T')[0];
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast show';
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => {
            toast.className = 'toast';
        }, 2500);
    }

    async function loadRooms() {
        try {
            const response = await fetch('/api/rooms');
            if (!response.ok) {
                throw new Error('Ошибка загрузки комнат');
            }
            const data = await response.json();
            rooms = data.map((room, index) => {
                return {
                    ...room,
                    id: Number(room.id) || index + 1,
                    bookings: room.bookings || []
                };
            });
            renderRooms();
        } catch (error) {
            console.error(error);
            showToast('Не удалось загрузить комнаты');
        }
    }

    function isRoomBusy(room) {
        const now = new Date();
        const today = getToday();
        return (room.bookings || []).some(booking => {
            if (booking.date !== today) {
                return false;
            }
            const start = new Date(today + 'T' + booking.start);
            const end = new Date(today + 'T' + booking.end);
            return now >= start && now <= end;
        });
    }

    function renderRooms() {
        const grid = document.getElementById('roomGrid');
        grid.innerHTML = '';
        if (rooms.length === 0) {
            grid.innerHTML = '<p>Комнат пока нет</p>';
            return;
        }
        rooms.forEach(room => {
            const busy = isRoomBusy(room);
            const card = document.createElement('div');
            card.className = 'room-card' + (busy ? ' busy' : '');
            const statusText = busy ? '🔴 занята' : '🟢 свободна';
            const statusClass = busy ? 'busy' : 'free';
            card.innerHTML = `
                <div class="top">
                    <span class="name">${room.name}</span>
                    <span class="capacity">${room.capacity} мест</span>
                </div>
                <div class="status ${statusClass}">${statusText}</div>
                <div class="equipment">Оснащение: ${room.equipment || '—'}</div>
                <div class="organization">Организация: ${room.organization || '—'}</div>
                <div class="footer">
                    <button class="btn-book" data-room-id="${room.id}" ${busy ? 'disabled' : ''}>
                        ${busy ? 'Занято' : 'Забронировать'}
                    </button>
                </div>
            `;
            grid.appendChild(card);
        });
        document.querySelectorAll('.btn-book:not([disabled])').forEach(button => {
            button.addEventListener('click', function() {
                const roomId = Number(this.dataset.roomId);
                openBookModal(roomId);
            });
        });
    }

    function openBookModal(roomId) {
        const room = rooms.find(item => item.id === roomId);
        if (!room) {
            showToast('Комната не найдена');
            return;
        }
        document.getElementById('bookRoomName').textContent = room.name;
        document.getElementById('bookDate').value = getToday();
        document.getElementById('bookStart').value = '10:00';
        document.getElementById('bookEnd').value = '11:00';
        const modal = document.getElementById('bookModal');
        modal.dataset.roomId = roomId;
        modal.classList.add('active');
    }

    document.getElementById('cancelBook').addEventListener('click', function() {
        document.getElementById('bookModal').classList.remove('active');
    });

    document.getElementById('saveBook').addEventListener('click', async function() {
        const modal = document.getElementById('bookModal');
        const roomId = Number(modal.dataset.roomId);
        const room = rooms.find(item => item.id === roomId);
        if (!room) {
            showToast('Комната не найдена');
            return;
        }
        const date = document.getElementById('bookDate').value;
        const start = document.getElementById('bookStart').value;
        const end = document.getElementById('bookEnd').value;
        if (!date || !start || !end) {
            showToast('Заполните дату и время');
            return;
        }
        if (start >= end) {
            showToast('Начало должно быть раньше окончания');
            return;
        }
        try {
            const response = await fetch(`/api/rooms/${roomId}/bookings`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ date, start, end })
            });
            const result = await response.json();
            if (!response.ok) {
                throw new Error(result.detail || 'Ошибка бронирования');
            }
            await loadRooms();
            modal.classList.remove('active');
            showToast('Комната забронирована');
        } catch (error) {
            console.error(error);
            showToast(error.message);
        }
    });

    document.getElementById('addRoomBtn').addEventListener('click', function() {
        document.getElementById('addRoomModal').classList.add('active');
        document.getElementById('newRoomName').value = '';
        document.getElementById('newRoomCapacity').value = '';
        document.getElementById('newRoomEquip').value = '';
    });

    document.getElementById('cancelAddRoom').addEventListener('click', function() {
        document.getElementById('addRoomModal').classList.remove('active');
    });

    document.getElementById('saveAddRoom').addEventListener('click', async function() {
        const name = document.getElementById('newRoomName').value.trim();
        const capacity = parseInt(document.getElementById('newRoomCapacity').value);
        const equipment = document.getElementById('newRoomEquip').value.trim();
        if (!name || !capacity || capacity < 1) {
            showToast('Введите название и вместимость');
            return;
        }
        try {
            const response = await fetch('/api/rooms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, capacity, equipment: equipment || '—', organization: 'МТС' })
            });
            const result = await response.json();
            if (!response.ok) {
                throw new Error(result.detail || 'Ошибка добавления комнаты');
            }
            await loadRooms();
            document.getElementById('addRoomModal').classList.remove('active');
            showToast('Комната добавлена');
        } catch (error) {
            console.error(error);
            showToast(error.message);
        }
    });

    loadRooms();
</script>

</body>
</html>
