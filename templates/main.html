<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confero</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f2ebe3;
            color: #1e1e1e;
            font-family: 'Inter', system-ui, sans-serif;
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
            border-bottom: 3px dashed #d9c5b2;
            padding-bottom: 12px;
        }

        .logo {
            font-family: 'DM Serif Display', serif;
            font-size: 36px;
        }

        .logo span {
            font-style: italic;
            color: #a67b5e;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            display: inline-block;
            background: #1e1e1e;
            color: #fcf8f5;
            border: 2px solid #1e1e1e;
            padding: 10px 20px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.12s;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 0.3px;
            border-radius: 0;
        }

        .btn:hover {
            background: #fcf8f5;
            color: #1e1e1e;
        }

        .btn-outline {
            background: transparent;
            color: #1e1e1e;
        }

        .add-wrap {
            margin-bottom: 24px;
        }

        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .room-card {
            background: #fcf8f5;
            padding: 20px;
            border: 2px solid #1e1e1e;
            border-radius: 8px 28px 8px 28px;
            box-shadow: 6px 6px 0 #1e1e1e;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .room-card.busy {
            opacity: 0.6;
            background: #ece3db;
        }

        .room-card .top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .room-card .name {
            font-family: 'DM Serif Display', serif;
            font-size: 22px;
        }

        .room-card .capacity {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            background: #ece3db;
            padding: 2px 10px;
            border: 1px solid #1e1e1e;
            white-space: nowrap;
        }

        .room-card .status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .room-card .status.free {
            color: #2b6e3b;
        }

        .room-card .status.busy {
            color: #a63a3a;
        }

        .room-card .equipment,
        .room-card .organization {
            font-size: 14px;
        }

        .room-card .footer {
            display: flex;
            justify-content: flex-end;
            border-top: 2px dotted #d9c5b2;
            padding-top: 12px;
            margin-top: auto;
        }

        .btn-book {
            background: #1e1e1e;
            color: #fcf8f5;
            border: 2px solid #1e1e1e;
            padding: 7px 16px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-book:hover:not(:disabled) {
            background: #fcf8f5;
            color: #1e1e1e;
        }

        .btn-book:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #b3a69b;
            color: #1e1e1e;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(30, 30, 30, 0.3);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #fcf8f5;
            padding: 32px;
            border: 2px solid #1e1e1e;
            border-radius: 8px 36px 8px 36px;
            box-shadow: 10px 10px 0 #1e1e1e;
            max-width: 480px;
            width: 90%;
        }

        .modal h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 28px;
            margin-bottom: 20px;
            border-bottom: 3px dashed #d9c5b2;
            padding-bottom: 8px;
        }

        .modal label {
            display: block;
            margin: 12px 0 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
        }

        .modal input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #1e1e1e;
            font-size: 15px;
            outline: none;
        }

        .modal .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-secondary {
            background: transparent;
            color: #1e1e1e;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1e1e;
            color: #fcf8f5;
            padding: 14px 24px;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: stretch;
            }

            .header-actions {
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <header>
            <div class="logo">
                Con<span>fero</span>
            </div>

            <div class="header-actions">
                <a href="/booking" class="btn btn-outline">
                    Мои бронирования
                </a>

                <a href="/login" class="btn btn-outline">
                    Выйти
                </a>
            </div>
        </header>

        <div class="add-wrap">
            <button class="btn" id="addRoomBtn">
                Добавить комнату
            </button>
        </div>

        <div class="room-grid" id="roomGrid"></div>
    </div>

    <div class="modal-overlay" id="addRoomModal">
        <div class="modal">
            <h2>Новая комната</h2>

            <label for="newRoomName">Название</label>
            <input
                type="text"
                id="newRoomName"
                placeholder="Переговорная А"
            >

            <label for="newRoomCapacity">Вместимость</label>
            <input
                type="number"
                id="newRoomCapacity"
                placeholder="10"
                min="1"
            >

            <label for="newRoomEquip">Оснащение</label>
            <input
                type="text"
                id="newRoomEquip"
                placeholder="Проектор, доска"
            >

            <div class="actions">
                <button class="btn btn-secondary" id="cancelAddRoom">
                    Отмена
                </button>

                <button class="btn" id="saveAddRoom">
                    Сохранить
                </button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="bookModal">
        <div class="modal">
            <h2>Бронирование</h2>

            <p id="bookRoomName"></p>

            <label for="bookDate">Дата</label>
            <input type="date" id="bookDate">

            <label for="bookStart">Начало</label>
            <input type="time" id="bookStart">

            <label for="bookEnd">Конец</label>
            <input type="time" id="bookEnd">

            <div class="actions">
                <button class="btn btn-secondary" id="cancelBook">
                    Отмена
                </button>

                <button class="btn" id="saveBook">
                    Забронировать
                </button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let rooms = [];
        let nextBookingId = 1;

        async function loadRooms() {
            try {
                const response = await fetch('/api/rooms');

                if (!response.ok) {
                    throw new Error('Ошибка загрузки комнат');
                }

                rooms = await response.json();

                renderRooms();

            } catch (error) {
                console.error(error);
                showToast('Ошибка загрузки комнат');
            }
        }

        function getToday() {
            return new Date().toISOString().split('T')[0];
        }

        function isRoomBusy(room) {
            const now = new Date();
            const today = getToday();

            return (room.bookings || []).some(booking => {
                if (booking.date !== today) {
                    return false;
                }

                const start = new Date(
                    today + 'T' + booking.start
                );

                const end = new Date(
                    today + 'T' + booking.end
                );

                return now >= start && now <= end;
            });
        }

        function renderRooms() {
            const grid = document.getElementById('roomGrid');

            grid.innerHTML = '';

            rooms.forEach(room => {
                const busy = isRoomBusy(room);

                const card = document.createElement('div');

                card.className = 'room-card';

                if (busy) {
                    card.classList.add('busy');
                }

                const statusText = busy
                    ? '🔴 Занята'
                    : '🟢 Свободна';

                const statusClass = busy
                    ? 'busy'
                    : 'free';

                card.innerHTML = `
                    <div class="top">
                        <span class="name">
                            ${room.name}
                        </span>

                        <span class="capacity">
                            ${room.capacity} мест
                        </span>
                    </div>

                    <div class="status ${statusClass}">
                        ${statusText}
                    </div>

                    <div class="equipment">
                        Оснащение: ${room.equipment || '—'}
                    </div>

                    <div class="organization">
                        Организация: ${room.organization || '—'}
                    </div>

                    <div class="footer">
                        <button
                            class="btn-book"
                            data-room-id="${room.id}"
                            ${busy ? 'disabled' : ''}
                        >
                            ${busy ? 'Занято' : 'Забронировать'}
                        </button>
                    </div>
                `;

                grid.appendChild(card);
            });

            document
                .querySelectorAll('.btn-book:not([disabled])')
                .forEach(button => {
                    button.addEventListener('click', function() {
                        const roomId = Number(
                            this.dataset.roomId
                        );

                        openBookModal(roomId);
                    });
                });
        }

        function openBookModal(roomId) {
            const room = rooms.find(
                item => item.id === roomId
            );

            if (!room) {
                return;
            }

            document
                .getElementById('bookRoomName')
                .textContent = room.name;

            document
                .getElementById('bookDate')
                .value = getToday();

            document
                .getElementById('bookStart')
                .value = '10:00';

            document
                .getElementById('bookEnd')
                .value = '11:00';

            const modal = document.getElementById('bookModal');

            modal.dataset.roomId = roomId;
            modal.classList.add('active');
        }

        document
            .getElementById('addRoomBtn')
            .addEventListener('click', function() {
                document
                    .getElementById('addRoomModal')
                    .classList.add('active');

                document
                    .getElementById('newRoomName')
                    .value = '';

                document
                    .getElementById('newRoomCapacity')
                    .value = '';

                document
                    .getElementById('newRoomEquip')
                    .value = '';
            });

        document
            .getElementById('cancelAddRoom')
            .addEventListener('click', function() {
                document
                    .getElementById('addRoomModal')
                    .classList.remove('active');
            });

        document
            .getElementById('saveAddRoom')
            .addEventListener('click', async function() {
                const name = document
                    .getElementById('newRoomName')
                    .value
                    .trim();

                const capacity = parseInt(
                    document
                        .getElementById('newRoomCapacity')
                        .value
                );

                const equipment = document
                    .getElementById('newRoomEquip')
                    .value
                    .trim();

                if (!name || !capacity || capacity < 1) {
                    showToast(
                        'Введите название и вместимость'
                    );

                    return;
                }

                try {
                    const response = await fetch('/api/rooms', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            name: name,
                            capacity: capacity,
                            equipment: equipment || '—',
                            organization: 'МТС'
                        })
                    });

                    if (!response.ok) {
                        throw new Error(
                            'Комната не сохранилась'
                        );
                    }

                    const savedRoom = await response.json();

                    rooms.push(savedRoom);

                    document
                        .getElementById('addRoomModal')
                        .classList.remove('active');

                    renderRooms();

                    showToast(
                        'Комната добавлена в JSON'
                    );

                } catch (error) {
                    console.error(error);
                    showToast(
                        'Ошибка сохранения комнаты'
                    );
                }
            });

        document
            .getElementById('cancelBook')
            .addEventListener('click', function() {
                document
                    .getElementById('bookModal')
                    .classList.remove('active');
            });

        document
            .getElementById('saveBook')
            .addEventListener('click', function() {
                const modal = document
                    .getElementById('bookModal');

                const roomId = Number(
                    modal.dataset.roomId
                );

                const room = rooms.find(
                    item => item.id === roomId
                );

                if (!room) {
                    return;
                }

                const date = document
                    .getElementById('bookDate')
                    .value;

                const start = document
                    .getElementById('bookStart')
                    .value;

                const end = document
                    .getElementById('bookEnd')
                    .value;

                if (!date || !start || !end) {
                    showToast(
                        'Заполните дату и время'
                    );

                    return;
                }

                if (start >= end) {
                    showToast(
                        'Начало должно быть раньше конца'
                    );

                    return;
                }

                if (!room.bookings) {
                    room.bookings = [];
                }

                room.bookings.push({
                    id: nextBookingId++,
                    date: date,
                    start: start,
                    end: end,
                    participants: []
                });

                modal.classList.remove('active');

                renderRooms();

                showToast(
                    'Бронирование создано'
                );
            });

        function showToast(message) {
            const toast = document
                .getElementById('toast');

            toast.textContent = message;
            toast.className = 'toast show';

            clearTimeout(toast.timer);

            toast.timer = setTimeout(function() {
                toast.className = 'toast';
            }, 2500);
        }

        loadRooms();
    </script>
</body>
</html>
