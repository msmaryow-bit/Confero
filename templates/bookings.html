<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confero</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f2ebe3;
            color: #1e1e1e;
            font-family: 'Inter', system-ui, sans-serif;
            padding: 24px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 5%;
            left: 3%;
            width: 280px;
            height: 280px;
            background: #d9c5b2;
            border-radius: 40% 60% 70% 30% / 50% 40% 60% 50%;
            opacity: 0.10;
            transform: rotate(-10deg);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: 8%;
            right: 5%;
            width: 200px;
            height: 200px;
            background: #cbb09b;
            border-radius: 30% 70% 50% 50% / 40% 40% 60% 60%;
            opacity: 0.10;
            transform: rotate(20deg);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
            border-bottom: 3px dashed #d9c5b2;
            padding-bottom: 12px;
        }

        .logo {
            font-family: 'DM Serif Display', serif;
            font-size: 36px;
            font-weight: 400;
            letter-spacing: -1px;
            color: #1e1e1e;
            text-decoration: none;
        }

        .logo span {
            font-style: italic;
            color: #a67b5e;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            background: #1e1e1e;
            color: #fcf8f5;
            border: 2px solid #1e1e1e;
            padding: 10px 20px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.12s;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-radius: 0;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #fcf8f5;
            color: #1e1e1e;
        }

        .btn-outline {
            background: transparent;
            color: #1e1e1e;
        }

        .btn-outline:hover {
            background: #1e1e1e;
            color: #fcf8f5;
        }

        .page-title {
            font-family: 'DM Serif Display', serif;
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 24px;
        }

        .booking-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .booking-item {
            background: #fcf8f5;
            padding: 16px 20px;
            border: 2px solid #1e1e1e;
            border-radius: 8px 20px 8px 20px;
            box-shadow: 4px 4px 0 #1e1e1e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .booking-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .booking-room {
            font-family: 'DM Serif Display', serif;
            font-size: 20px;
            font-weight: 400;
        }

        .booking-details {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: #3d322b;
        }

        .booking-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .booking-status.active {
            color: #2b6e3b;
        }

        .booking-status.past {
            color: #7f6b5c;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 13px;
        }

        .btn-danger {
            background: #1e1e1e;
            color: #fcf8f5;
            border: 2px solid #a63a3a;
        }

        .btn-danger:hover {
            background: #a63a3a;
            color: #fcf8f5;
            border-color: #a63a3a;
        }

        .empty {
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            color: #7f6b5c;
            padding: 40px 0;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: #1e1e1e;
            color: #fcf8f5;
            padding: 12px 24px;
            border: 2px solid #1e1e1e;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            box-shadow: 6px 6px 0 #1e1e1e;
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            transition: opacity 0.25s ease, transform 0.25s ease;
            border-radius: 0;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.hide {
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
        }

        @media (max-width: 600px) {
            header { flex-direction: column; align-items: stretch; }
            .header-actions { justify-content: space-between; }
            .booking-item { flex-direction: column; align-items: stretch; }
            .booking-info { align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <a href="main.html" class="logo">Con<span>fero</span></a>
        <div class="header-actions">
            <button class="btn btn-outline" id="logoutBtn">Выйти</button>
        </div>
    </header>

    <h1 class="page-title">Мои бронирования</h1>
    <div id="bookingList" class="booking-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show';
        clearTimeout(t._timer);
        t._timer = setTimeout(() => {
            t.className = 'toast hide';
            setTimeout(() => { t.className = 'toast'; }, 300);
        }, 2500);
    }

    function isBookingActive(booking) {
        const today = new Date().toISOString().split('T')[0];
        if (booking.date < today) return false;
        if (booking.date > today) return true;
        const now = new Date();
        const end = new Date(booking.date + 'T' + booking.end);
        return now < end;
    }

    async function loadAllBookings() {
        try {
            const resp = await fetch('/api/all-bookings');
            if (!resp.ok) throw new Error('Ошибка загрузки');
            const bookings = await resp.json();
            renderBookings(bookings);
        } catch (e) {
            console.error(e);
            showToast('Не удалось загрузить бронирования');
        }
    }

    function renderBookings(bookings) {
        const container = document.getElementById('bookingList');
        if (bookings.length === 0) {
            container.innerHTML = '<div class="empty">Бронирований пока нет</div>';
            return;
        }
        bookings.sort((a, b) => {
            if (a.date !== b.date) return a.date.localeCompare(b.date);
            return a.start.localeCompare(b.start);
        });

        container.innerHTML = '';
        bookings.forEach(b => {
            const active = isBookingActive(b);
            const statusText = active ? 'активна' : 'завершена';
            const statusClass = active ? 'active' : 'past';
            const div = document.createElement('div');
            div.className = 'booking-item';
            div.innerHTML = `
                <div class="booking-info">
                    <div class="booking-room">${b.room_name}</div>
                    <div class="booking-details">${b.date} ${b.start} — ${b.end}</div>
                    <div class="booking-status ${statusClass}">${statusText}</div>
                </div>
                ${active ? `<button class="btn btn-sm btn-danger" data-booking-id="${b.booking_id}" data-room-id="${b.room_id}">Отменить</button>` : ''}
            `;
            container.appendChild(div);
        });

        document.querySelectorAll('[data-booking-id]').forEach(btn => {
            btn.addEventListener('click', async function() {
                const bookingId = parseInt(this.dataset.bookingId);
                const roomId = parseInt(this.dataset.roomId);
                await cancelBooking(roomId, bookingId);
            });
        });
    }

    async function cancelBooking(roomId, bookingId) {
        try {
            const resp = await fetch(`/api/rooms/${roomId}/bookings/${bookingId}`, {
                method: 'DELETE'
            });
            if (!resp.ok) throw new Error('Не удалось отменить');
            showToast('Бронирование отменено');
            loadAllBookings();
        } catch (e) {
            showToast(e.message);
        }
    }


    document.addEventListener('DOMContentLoaded', loadAllBookings);


    document.getElementById('logoutBtn').addEventListener('click', function() {
        document.cookie = 'user_email=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        window.location.href = '/login';
    });
</script>
</body>
</html>
